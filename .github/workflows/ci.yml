name: CI

# Dogfooding: the kit holds itself to its own ci-cd.md standards —
# least-privilege token, SHA-pinned actions, hardened runner.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Lint docs + check links
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

      - name: Check internal links resolve
        run: bash scripts/check-links.sh

  skills:
    name: Validate skills + hooks
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate SKILL.md files
        run: bash scripts/check-skills.sh

      - name: Validate standards docs
        run: bash scripts/check-standards.sh

      - name: Skill description quality (advisory)
        run: bash scripts/check-skill-quality.sh

      - name: Skills catalog is up to date
        run: |
          bash scripts/gen-skill-catalog.sh >/tmp/catalog.md
          diff -q /tmp/catalog.md skills/CATALOG.md \
            || { echo "skills/CATALOG.md is stale — run: bash scripts/gen-skill-catalog.sh > skills/CATALOG.md"; exit 1; }

  shell:
    name: Lint shell (shellcheck + shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax-check
        run: bash -n hooks/*.sh scripts/*.sh templates/*.sh

      - name: shellcheck
        run: shellcheck hooks/*.sh scripts/*.sh templates/*.sh

      - name: shfmt (diff-only)
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          "$(go env GOPATH)/bin/shfmt" -d -i 2 hooks/*.sh scripts/*.sh templates/*.sh
