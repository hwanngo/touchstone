# touchstone CodeQL starter — copy to .github/workflows/codeql.yml. See standards/practices/security.md §3.
# Pin actions to SHA (`pinact run`). Set `languages` to what the repo uses.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly, off-peak

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload findings
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, go] # trim to your stacks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
