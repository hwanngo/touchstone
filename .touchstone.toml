# touchstone self-adoption marker — the kit holds itself to its own drift gate.
# See scripts/check-sync.sh. version is kept in lockstep by scripts/bump-version.sh.
version = "0.2.0"
stacks = []
# `level` is a CONFORMANCE CLAIM (standards/self-audit.md's "Maturity levels" section): the highest
# level at which every applicable item is currently PASS/WAIVED/N/A, re-derived against the repo as
# it stands, not a target to grow into. Re-derived 2026-08-17, item by item against
# standards/self-audit.md's L1-marked items (`grep '\*\*L1\*\*' standards/self-audit.md` is the list
# that was walked). Verdict: the kit does not yet conform even at L1. The four open L1 fails are named
# in full below — this is the whole evidence for `level = 0`, stated here rather than cited, so any
# reader can re-check each one against the repo:
#   - justfile lacks the `setup`/`fmt`/`build` recipes practices/collaboration.md §5 requires of
#     every repo's task-runner contract (templates/justfile, the adopter-facing copy, has all six;
#     the kit's own root justfile has only default/test/lint/gates/ci).
#   - no docs/adr/ record exists for this repo's own significant, hard-to-reverse decisions (bash-
#     only architecture, submodule vendoring, the CI required-check aggregator) per
#     standards/practices/collaboration.md §6 / standards/design/architecture.md §4.
#   - most of the kit's own scripts start `set -uo pipefail`, omitting the `-e` that
#     standards/languages/shell.md's safety preamble requires unconditionally. Measured against the
#     TRACKED shell files, so the denominator is checkable:
#       git ls-files '*.sh' | wc -l                                            -> 61
#       git ls-files '*.sh' | xargs grep -l 'set -uo pipefail' | wc -l          -> 52
#       git ls-files '*.sh' | xargs grep -LE '^ *set -[a-z]*e' | wc -l          -> 54
#     52 of 61 carry the `-e`-less preamble; only 6 use `set -euo pipefail` (bootstrap.sh,
#     bump-version.sh, check-sync.sh, gen-skill-catalog.sh, init.sh, and one eval fixture), and
#     templates/script-header.sh is the one file that has both (it documents the preamble).
#     An earlier note here said "51 of 57", whose denominator matched no measurable set.
#   - several scripts exceed the ~100-line threshold standards/languages/shell.md §8 sets for
#     rewriting in Python/Go without being rewritten (hooks/guard-bash.sh alone is over 1000 lines;
#     `git ls-files '*.sh' | xargs wc -l` is the list).
# 0 = conforms at no level, this repo's explicit "below L1" sentinel — the maturity table only
# defines L1-L4, so 0 is not one of its levels, only a statement that none of them is met yet.
level = 0
waivers = []         # documented, reviewed exceptions (standards-level; NOT file drift)

# Managed files whose KIT copy intentionally differs from the adopter-facing template it ships.
# Entry format: "<dest> :: <sha256 of dest> :: <sha256 of kit source> :: <reason>".
# check-sync fails on undeclared drift, on a stale entry (files now identical), and on any
# hash mismatch (either side edited without re-declaring). To re-declare after an intentional
# edit: scripts/check-sync.sh --print-diverge <dest>  and paste the emitted line.
diverge = [
  "justfile :: 816585d3e6fd44471a17e27e513bd45d5fbdf46288ea0395c07532381b69c0e5 :: 13b9207738158155fe061f6688a089dc813fbce2c50f1d8d545cd908a8168e35 :: kit's runner executes the kit's own bash/markdown gates; templates/justfile is the multi-stack adopter starter",
  ".github/dependabot.yml :: 02755ac13e8eaf350673e14f49e150c00296dea60e314dc6dbe207b3fe76c369 :: 77c7b2dd3d1e71d913a7903a803230b09b7adaa7b504654792b50a8b71b0be54 :: kit is bash+markdown so github-actions is its only ecosystem (grouped PRs); the template enables per-stack ecosystems",
  ".github/workflows/ci.yml :: 5de6ad842e1b01e5d264e0b19a1e90fffc5c4908d6f4fcf52d65f6de50e8605a :: 7693a02da349f6eb16528f2983292e02b69d01011b393b512297986e6a665496 :: kit CI runs the docs/skills/shell/tests/sync/secret-scan/workflow-lint gates on the kit itself, behind a ci-required aggregator; the template is the python/node/go starter",
  ".pre-commit-config.yaml :: faee252b6aeaf90480950a73481527f65dfcff855f41083de7f97f3bb229a605 :: 69405d8631420e14d19aa330e04a0bd10ed8c245b1d55b6d91b757c90a206559 :: kit is bash+markdown, so the template's python/node/actions hook blocks are replaced by shellcheck/shfmt/markdownlint-cli2 local hooks running the same commands as `just lint`, plus a tests/fixtures/ exclusion so no hook rewrites deliberately-malformed test data",
]
